name: Build Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Stage files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=packaging/deb/staging
          mkdir -p "$STAGE/DEBIAN" "$STAGE/usr/bin" "$STAGE/usr/lib/flashdash/assets" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/256x256/apps"
          cp ftp_server_app.py "$STAGE/usr/lib/flashdash/"
          cp requirements.txt "$STAGE/usr/lib/flashdash/"
          cp assets/old-icon.png "$STAGE/usr/lib/flashdash/assets/"
          cp assets/old-icon.png "$STAGE/usr/share/icons/hicolor/256x256/apps/flashdash.png"
          cp packaging/deb/flashdash.launcher "$STAGE/usr/bin/flashdash"
          chmod 0755 "$STAGE/usr/bin/flashdash"
          cp packaging/shared/flashdash.desktop "$STAGE/usr/share/applications/"
          cp packaging/deb/DEBIAN/postinst "$STAGE/DEBIAN/postinst"
          chmod 0755 "$STAGE/DEBIAN/postinst"
          sed "s/VERSION_PLACEHOLDER/$VERSION/" packaging/deb/DEBIAN/control.template > "$STAGE/DEBIAN/control"

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fakeroot dpkg-deb --build packaging/deb/staging "flashdash_${VERSION}_all.deb"
          ls -lh flashdash_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashdash-deb
          path: "flashdash_*.deb"
          if-no-files-found: error

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y rpm-build

      - name: Build .rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf ~/rpmbuild/SOURCES/flashdash-${VERSION}.tar.gz --transform "s|^|flashdash-${VERSION}/|" ftp_server_app.py assets/old-icon.png requirements.txt packaging/deb/flashdash.launcher packaging/shared/flashdash.desktop
          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" -e "s|REPO_PLACEHOLDER|${GITHUB_REPOSITORY}|g" packaging/rpm/flashdash.spec.template > ~/rpmbuild/SPECS/flashdash.spec
          rpmbuild -bb ~/rpmbuild/SPECS/flashdash.spec
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          ls -lh *.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashdash-rpm
          path: "*.rpm"
          if-no-files-found: error

  build-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller PyQt5 pyftpdlib tftpy Pillow

      - name: Convert icon PNG to ICO
        run: python packaging/win/convert_icon.py

      - name: Build EXE
        shell: pwsh
        run: |
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
          pyinstaller `
            --onefile `
            --windowed `
            --icon=assets/flashdash.ico `
            --name=FlashDash `
            --add-data "assets;assets" `
            ftp_server_app.py
          Rename-Item dist\FlashDash.exe "FlashDash-${VERSION}-windows.exe"
          Get-Item dist\*.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: "dist/FlashDash-*-windows.exe"
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-deb, build-rpm, build-exe]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List files
        run: find dist/ -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
