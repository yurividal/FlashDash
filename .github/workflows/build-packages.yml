name: Build Linux Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev fakeroot

      - name: Stage files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE=packaging/deb/staging
          mkdir -p "$STAGE/DEBIAN" "$STAGE/usr/bin" "$STAGE/usr/lib/flashdash/assets" "$STAGE/usr/share/applications" "$STAGE/usr/share/icons/hicolor/scalable/apps"
          cp ftp_server_app.py "$STAGE/usr/lib/flashdash/"
          cp requirements.txt "$STAGE/usr/lib/flashdash/"
          cp assets/icon.svg "$STAGE/usr/lib/flashdash/assets/"
          cp assets/icon.svg "$STAGE/usr/share/icons/hicolor/scalable/apps/flashdash.svg"
          cp packaging/deb/flashdash.launcher "$STAGE/usr/bin/flashdash"
          chmod 0755 "$STAGE/usr/bin/flashdash"
          cp packaging/shared/flashdash.desktop "$STAGE/usr/share/applications/"
          cp packaging/deb/DEBIAN/postinst "$STAGE/DEBIAN/postinst"
          chmod 0755 "$STAGE/DEBIAN/postinst"
          sed "s/VERSION_PLACEHOLDER/$VERSION/" packaging/deb/DEBIAN/control.template > "$STAGE/DEBIAN/control"

      - name: Build .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          fakeroot dpkg-deb --build packaging/deb/staging "flashdash_${VERSION}_all.deb"
          ls -lh flashdash_*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashdash-deb
          path: "flashdash_*.deb"
          if-no-files-found: error

  build-rpm:
    name: Build .rpm package
    runs-on: ubuntu-22.04
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: dnf install -y rpm-build

      - name: Build .rpm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar czf ~/rpmbuild/SOURCES/flashdash-${VERSION}.tar.gz --transform "s|^|flashdash-${VERSION}/|" ftp_server_app.py assets/icon.svg requirements.txt packaging/deb/flashdash.launcher packaging/shared/flashdash.desktop
          sed -e "s/VERSION_PLACEHOLDER/${VERSION}/g" -e "s|REPO_PLACEHOLDER|${GITHUB_REPOSITORY}|g" packaging/rpm/flashdash.spec.template > ~/rpmbuild/SPECS/flashdash.spec
          rpmbuild -bb ~/rpmbuild/SPECS/flashdash.spec
          find ~/rpmbuild/RPMS -name "*.rpm" -exec cp {} . \;
          ls -lh *.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashdash-rpm
          path: "*.rpm"
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List files
        run: find dist/ -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
